providers = ["php"]

[phases.setup]
nixPkgs = ["php84", "php84Extensions.mbstring", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.openssl", "php84Extensions.tokenizer", "php84Extensions.xml", "php84Extensions.ctype", "php84Extensions.fileinfo", "php84Extensions.bcmath", "php84Extensions.curl"]

[phases.install]
cmds = ["composer install --optimize-autoloader --no-dev"]

[start]
cmd = "php artisan serve --host 0.0.0.0 --port $PORT"
