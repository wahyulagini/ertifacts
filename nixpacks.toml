providers = ["php"]

[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83Extensions.mbstring", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.openssl", "php83Extensions.tokenizer", "php83Extensions.xml", "php83Extensions.ctype", "php83Extensions.fileinfo", "php83Extensions.bcmath", "php83Extensions.curl"]

[phases.install]
cmds = ["composer install --optimize-autoloader --no-dev --ignore-platform-reqs"]

[phases.build]
cmds = []

[start]
cmd = "php artisan migrate --force && php artisan storage:link --force && php artisan serve --host 0.0.0.0 --port $PORT"
